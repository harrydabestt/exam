<style>
:root{
  --bg:#0f1221;--surface:#1a1f36;--surface2:#242b45;--border:#2e3658;
  --text:#e8eaf6;--muted:#9aa3c7;--accent:#7c5cff;--accent2:#00d4aa;
  --danger:#ff5c7a;--warn:#ffc14d;--bio:#34d399;--phy:#60a5fa;--chem:#f472b6;--eng:#fbbf24;--math:#a78bfa;
  --radius:14px;--shadow:0 8px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
button,input,textarea{font:inherit}
a{color:var(--accent)}


/* PREMIUM INTRO */
#intro{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  overflow:hidden;cursor:pointer;
  transition:opacity .9s ease,visibility .9s;
  background:#0c0a1a;
}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
#intro .intro-bg{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;opacity:.38;z-index:0;
  filter:saturate(1.1) contrast(1.05);
  transform:scale(1.05);
  animation:bgSlow 12s ease-in-out infinite alternate;
}
@keyframes bgSlow{from{transform:scale(1.05) translateY(0)}to{transform:scale(1.12) translateY(-2%)}}
#intro::before{
  content:"";position:absolute;inset:0;z-index:1;
  background:radial-gradient(ellipse at 50% 40%, rgba(124,92,255,.25) 0%, rgba(12,10,26,.75) 55%, rgba(12,10,26,.92) 100%);
}
#intro::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg, transparent 60%, rgba(12,10,26,.85) 100%);
}
.intro-stage{position:relative;z-index:5;text-align:center;padding:1rem}
.letter-row{
  display:flex;justify-content:center;flex-wrap:wrap;gap:0.02em;
  font-size:clamp(2.2rem, 11vw, 4.5rem);
  font-weight:900;
  letter-spacing:0.06em;
  line-height:1.05;
  filter:drop-shadow(0 8px 40px rgba(167,139,250,.45));
}
.letter{
  display:inline-block;
  color:#fff;
  opacity:0;
  transform:translateY(-80vh) scale(0.3) rotateX(40deg);
  animation: fallPremium 0.9s cubic-bezier(.16,1.2,.3,1) forwards;
}
.letter.space{width:0.35em}
@keyframes fallPremium{
  0%{opacity:0;transform:translateY(-80vh) scale(.3) rotateX(50deg);filter:blur(12px)}
  60%{opacity:1;filter:blur(0)}
  80%{transform:translateY(10px) scale(1.08) rotateX(-4deg)}
  100%{opacity:1;transform:translateY(0) scale(1) rotateX(0);filter:blur(0)}
}
.letter.glow{
  background:linear-gradient(105deg,#fff 0%,#c4b5fd 25%,#f0abfc 50%,#67e8f9 75%,#fff 100%);
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation: shineText 3s ease infinite;
  filter:drop-shadow(0 0 28px rgba(192,132,252,.7));
}
@keyframes shineText{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
.intro-sub{
  margin-top:1.4rem;
  font-size:clamp(.7rem,2.2vw,.9rem);
  letter-spacing:.4em;
  text-transform:uppercase;
  color:rgba(255,255,255,.7);
  font-weight:600;
  opacity:0;
  transition:opacity .8s ease .2s, transform .8s ease;
  transform:translateY(12px);
}
.intro-sub.show{opacity:1;transform:translateY(0)}
.intro-tap{
  position:absolute;bottom:6%;left:50%;transform:translateX(-50%);
  font-size:clamp(.65rem,2vw,.8rem);
  letter-spacing:.35em;
  text-transform:uppercase;
  color:rgba(255,255,255,.65);
  opacity:0;z-index:6;
  padding:.5rem 1.2rem;
  border:1px solid rgba(255,255,255,.2);
  border-radius:999px;
  backdrop-filter:blur(8px);
  transition:opacity .6s;
}
.intro-tap.show{opacity:1;animation:tapGlow 2s ease-in-out infinite}
@keyframes tapGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(167,139,250,.3);opacity:.65}
  50%{box-shadow:0 0 20px 4px rgba(167,139,250,.35);opacity:1}
}
.meme-layer{position:absolute;inset:0;pointer-events:none;z-index:3}
.meme{position:absolute;object-fit:contain;border-radius:14px;opacity:0;animation:memeIn .9s ease forwards;filter:drop-shadow(0 12px 28px rgba(0,0,0,.5))}
.meme.scream{width:min(24vw,140px);left:3%;bottom:14%;animation-delay:1.5s}
.meme.dance{width:min(22vw,130px);right:3%;bottom:12%;animation-delay:1.9s}
.meme.dora{display:none}
@keyframes memeIn{0%{opacity:0;transform:scale(.4) translateY(40px)}100%{opacity:1;transform:scale(1)}}
.scene3d{position:absolute;inset:0;pointer-events:none;z-index:2}

/* APP SHELL */
#app{display:none;min-height:100vh}
#app.show{display:block}
.topnav{position:sticky;top:0;z-index:100;background:rgba(15,18,33,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:.65rem 1rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.brand{font-weight:800;font-size:1rem;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.subj-tabs{display:flex;gap:.35rem;flex-wrap:wrap;flex:1}
.subj-tab{padding:.4rem .85rem;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-size:.82rem;font-weight:600;transition:.2s}
.subj-tab:hover{border-color:var(--accent);color:var(--text)}
.subj-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.subj-tab[data-s=bio].active{background:var(--bio);border-color:var(--bio);color:#064e3b}
.subj-tab[data-s=phy].active{background:var(--phy);border-color:var(--phy);color:#1e3a8a}
.subj-tab[data-s=chem].active{background:var(--chem);border-color:var(--chem);color:#831843}
.subj-tab[data-s=eng].active{background:var(--eng);border-color:var(--eng);color:#78350f}
.subj-tab[data-s=math].active{background:var(--math);border-color:var(--math);color:#4c1d95}
.icon-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 56px)}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:block;position:fixed;inset:56px 0 0 0;z-index:90;overflow:auto}}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:1rem .75rem;overflow-y:auto}
.side-title{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:.5rem .6rem}
.side-item{display:block;width:100%;text-align:left;padding:.55rem .7rem;border-radius:10px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:.88rem;margin:.15rem 0;transition:.15s}
.side-item:hover,.side-item.active{background:var(--surface2);color:var(--text)}
.main{padding:1.25rem;max-width:1100px;overflow-x:hidden}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.card h2{font-size:1.2rem;margin-bottom:.6rem}
.card h3{font-size:1rem;margin:1rem 0 .4rem;color:#c4b5fd}
.grid{display:grid;gap:1rem}
.grid-2{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.tile{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:1rem;cursor:pointer;transition:.2s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile h4{font-size:.95rem;margin-bottom:.25rem}
.tile p{font-size:.78rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.5rem 1rem;border-radius:10px;border:none;font-weight:600;font-size:.88rem;cursor:pointer;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:.32rem .7rem;font-size:.78rem}
.tag{display:inline-block;padding:.12rem .45rem;border-radius:6px;font-size:.68rem;font-weight:700;margin-right:.25rem}
.tag-1{background:#1e3a5f;color:#93c5fd}.tag-2{background:#3b2f1a;color:#fcd34d}.tag-3{background:#14352c;color:#6ee7b7}.tag-5{background:#3b1a2e;color:#f9a8d4}
.q-box{border-left:3px solid var(--accent);background:var(--surface2);border-radius:0 10px 10px 0;padding:.9rem 1rem;margin:.7rem 0}
.q-box.ok{border-color:var(--accent2)}.q-box.bad{border-color:var(--danger)}
.options label{display:block;padding:.4rem .6rem;margin:.2rem 0;border-radius:8px;cursor:pointer;border:1px solid transparent}
.options label:hover{background:rgba(255,255,255,.04)}
.model{display:none;margin-top:.55rem;padding:.75rem;background:rgba(124,92,255,.12);border:1px solid rgba(124,92,255,.3);border-radius:8px;font-size:.9rem;white-space:pre-wrap}
.model.show{display:block}
.score{text-align:center;padding:1rem;font-size:1.2rem;font-weight:700;background:linear-gradient(135deg,rgba(124,92,255,.2),rgba(0,212,170,.15));border-radius:12px;margin:1rem 0}
ul.clean{padding-left:1.15rem}ul.clean li{margin:.28rem 0}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.6rem 0}
th,td{border:1px solid var(--border);padding:.45rem .6rem;text-align:left}th{background:var(--surface2)}
.hero{background:linear-gradient(135deg,rgba(124,92,255,.25),rgba(0,212,170,.12));border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:1.25rem}
.hero h1{font-size:1.5rem;margin-bottom:.4rem}
.muted{color:var(--muted);font-size:.9rem}
.explain{margin-top:.5rem;padding:.5rem .7rem;border-radius:8px;font-size:.85rem}
.explain.ok{background:rgba(0,212,170,.12);color:#6ee7b7}.explain.bad{background:rgba(255,92,122,.12);color:#fda4af}

/* AI CHAT */
#aiFab{position:fixed;bottom:1.25rem;right:1.25rem;z-index:200;width:56px;height:56px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--accent),#a78bfa);color:#fff;font-size:1.4rem;cursor:pointer;box-shadow:0 8px 28px rgba(124,92,255,.45)}
#aiPanel{position:fixed;bottom:5.5rem;right:1.25rem;width:min(380px,calc(100vw - 2rem));height:min(520px,70vh);background:var(--surface);border:1px solid var(--border);border-radius:16px;z-index:200;display:none;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
#aiPanel.open{display:flex}
.ai-head{padding:.85rem 1rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:700}
.ai-msgs{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.65rem}
.msg{max-width:90%;padding:.65rem .85rem;border-radius:12px;font-size:.88rem;line-height:1.45}
.msg.bot{background:var(--surface2);align-self:flex-start;border-bottom-left-radius:4px}
.msg.user{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.ai-input{display:flex;gap:.4rem;padding:.75rem;border-top:1px solid var(--border)}
.ai-input input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:.55rem .75rem;color:var(--text);outline:none}
.ai-input button{background:var(--accent);border:none;color:#fff;border-radius:10px;padding:.55rem .85rem;cursor:pointer;font-weight:600}

.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem}
.hub-card{border-radius:16px;padding:1.35rem;cursor:pointer;border:1px solid var(--border);transition:.25s;position:relative;overflow:hidden}
.hub-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.hub-card.bio{background:linear-gradient(145deg,#064e3b,#0f766e)}.hub-card.phy{background:linear-gradient(145deg,#1e3a8a,#1d4ed8)}
.hub-card.chem{background:linear-gradient(145deg,#831843,#be185d)}.hub-card.eng{background:linear-gradient(145deg,#78350f,#b45309)}
.hub-card.math{background:linear-gradient(145deg,#4c1d95,#6d28d9)}
.hub-card h3{font-size:1.15rem;margin-bottom:.3rem}.hub-card p{font-size:.82rem;opacity:.9}
.progress-bar{height:6px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin-top:.7rem}
.progress-fill{height:100%;background:#fff;border-radius:99px;width:0%;transition:width .4s}
.hidden{display:none!important}
.footer{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:.78rem}

@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:none;position:fixed;inset:56px 0 0 0;z-index:90;overflow:auto;background:var(--surface)}
  .sidebar.open{display:block}
  .topnav{padding:.5rem .65rem}
  .subj-tabs{gap:.25rem}
  .subj-tab{padding:.35rem .55rem;font-size:.72rem}
  .brand span{font-size:.85rem}
  .brand img{width:26px;height:26px}
  .main{padding:.85rem}
  .hero h1{font-size:1.25rem}
  .hub-grid{grid-template-columns:1fr 1fr}
  #aiPanel{right:.5rem;left:.5rem;width:auto;bottom:5rem}
  #aiFab{right:.75rem;bottom:.75rem}
  .letter-row{font-size:clamp(1.4rem,8vw,2.4rem)}
  .meme.scream{width:22vw;left:2%;bottom:12%}
  .meme.dance{width:20vw;right:2%;bottom:10%}
  .meme.dora{display:none}
}
@media(max-width:480px){
  .hub-grid{grid-template-columns:1fr}
  .subj-tabs{width:100%;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
}

</style>
</head>

let currentSubj = 'hub';
let currentView = 'home';

function showSubject(s){
  currentSubj = s;
  document.querySelectorAll('.subj-tab').forEach(function(t){
    t.classList.toggle('active', t.dataset.s===s);
  });
  renderSidebar();
  const first = SIDEBARS[s][0].id;
  showView(first);
}

function renderSidebar(){
  const sb = document.getElementById('sidebar');
  const items = SIDEBARS[currentSubj] || [];
  sb.innerHTML = '<div class="side-title">'+ (SUBJECTS[currentSubj]?SUBJECTS[currentSubj].name:'') +'</div>' +
    items.map(function(it){
      return '<button class="side-item'+(it.id===currentView?' active':'')+'" data-v="'+it.id+'">'+it.label+'</button>';
    }).join('');
  sb.querySelectorAll('.side-item').forEach(function(btn){
    btn.addEventListener('click', function(){
      showView(btn.dataset.v);
      if(window.innerWidth<900) sb.classList.remove('open');
    });
  });
}

function showView(v){
  currentView = v;
  renderSidebar();
  const main = document.getElementById('main');
  const key = currentSubj + '_' + v;
  if(VIEWS[key]) main.innerHTML = VIEWS[key]();
  else if(VIEWS[currentSubj+'_dash'] && v==='dash') main.innerHTML = VIEWS[currentSubj+'_dash']();
  else main.innerHTML = VIEWS.generic ? VIEWS.generic() : '<div class="card"><h2>Coming soon</h2></div>';
  window.scrollTo(0,0);
}

function paperShell(subj, num, sectionsHtml){
  return '<div class="hero"><h1>'+subj+' – Board Paper '+num+'/20</h1>'+
    '<p class="muted">JKBOSE-style pattern · Different question set each time · Use Show answer</p>'+
    '<div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem">'+
    '<button type="button" class="btn btn-ghost btn-sm" onclick="showPaper(\''+subj+'\','+((num%20)+1)+')">Next paper →</button>'+
    '<button type="button" class="btn btn-ghost btn-sm" onclick="showPaper(\''+subj+'\','+((num+18)%20+1)+')">← Prev</button>'+
    '<button type="button" class="btn btn-primary btn-sm" onclick="showPaper(\''+subj+'\','+(Math.floor(Math.random()*20)+1)+')">Random paper</button>'+
    '</div></div>'+sectionsHtml;
}


function paperPicker(subj, name){
  var h = '<div class="hero"><h1>'+name+' – 20 Board Papers</h1><p class="muted">Each paper is a different mix · Full JKBOSE-style sections · Answers included</p></div><div class="grid grid-3">';
  for(var i=1;i<=20;i++){
    h += '<div class="tile" onclick="showPaper(\''+subj+'\','+i+')"><h4>Paper '+i+'</h4><p>Open full pattern test</p></div>';
  }
  h += '</div>';
  return h;
}

function showPaper(subj, num){
  num = ((num-1)%20)+1;
  var htmlp = '';
  if(subj==='bio') htmlp = buildBioPaper(num);
  else if(subj==='phy') htmlp = buildPhyPaper(num);
  else if(subj==='chem') htmlp = buildChemPaper(num);
  else if(subj==='eng') htmlp = buildEngPaper(num);
  else if(subj==='math') htmlp = buildMathPaper(num);
  else htmlp = '<div class="card">Unknown subject</div>';
  document.getElementById('main').innerHTML = htmlp;
  window.scrollTo(0,0);
}


function qaMcq(num, q, options, ansIdx, reason){
  // options = [A,B,C,D], ansIdx 0-3
  var h = '<div class="q-box" data-a="'+ansIdx+'" data-r="'+(reason||'').replace(/"/g,'&quot;')+'">';
  h += '<span class="tag tag-1">1</span> <strong>Q'+num+'. '+q+'</strong><div class="options">';
  for(var i=0;i<4;i++){
    h += '<label><input type="radio" name="pq'+num+'" value="'+i+'"> '+String.fromCharCode(65+i)+'. '+options[i]+'</label>';
  }
  h += '</div></div>';
  return h;
}
function evalPaperMcq(){
  var c=0,t=0;
  document.querySelectorAll('#paperMcqBox .q-box').forEach(function(qbox){
    t++;
    var ans=parseInt(qbox.getAttribute('data-a'),10);
    var reason=qbox.getAttribute('data-r')||'';
    var sel=qbox.querySelector('input:checked');
    qbox.classList.remove('ok','bad');
    var old=qbox.querySelector('.explain'); if(old) old.remove();
    var labels=qbox.querySelectorAll('label');
    var correctText='';
    labels.forEach(function(lab,idx){
      lab.style.border='1px solid transparent'; lab.style.background='';
      if(idx===ans){ correctText=lab.textContent.trim(); lab.style.border='1px solid #34d399'; lab.style.background='rgba(52,211,153,.12)'; }
    });
    var exp=document.createElement('div'); exp.className='explain';
    if(sel && parseInt(sel.value,10)===ans){ c++; qbox.classList.add('ok'); exp.className+=' ok'; exp.innerHTML='✓ Correct. '+reason; }
    else {
      qbox.classList.add('bad'); exp.className+=' bad';
      exp.innerHTML='✗ Correct: <strong>'+correctText+'</strong><br>'+reason;
      if(sel&&sel.parentElement){ sel.parentElement.style.border='1px solid #ff5c7a'; sel.parentElement.style.background='rgba(255,92,122,.12)'; }
    }
    qbox.appendChild(exp);
  });
  var sc=document.getElementById('paperMcqScore');
  if(sc){ sc.classList.remove('hidden'); sc.textContent='Section A score: '+c+'/'+t+' ('+(t?Math.round(c/t*100):0)+'%)'; }
}

function qaBlock(marks, q, ans){
  ans = String(ans||'').replace(/</g,'&lt;');
  return '<div class="q-box"><span class="tag tag-3">'+marks+'</span> <strong>'+q+'</strong><br>'+
    '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:.4rem" onclick="this.nextElementSibling.classList.toggle(\'show\')">Show answer</button>'+
    '<div class="model" style="white-space:pre-wrap">'+ans+'</div></div>';
}

function pick(arr, n, seed){
  var a = arr.slice();
  var s = seed || 1;
  for(var i=a.length-1;i>0;i--){
    s = (s*1103515245+12345)&0x7fffffff;
    var j = s % (i+1);
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a.slice(0, Math.min(n,a.length));
}

VIEWS.bio_lessons = function(){
  function ch(id,title,full,sum){
    return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;flex-wrap:wrap"><h2 style="margin:0;font-size:1.15rem">'+title+'</h2>'+
    '<button type="button" class="btn btn-ghost btn-sm" id="'+id+'-btn" onclick="toggleSum(\''+id+'\')">⚡ Quick summary</button></div>'+
    '<div id="'+id+'-full" style="margin-top:.85rem;line-height:1.65">'+full+'</div>'+
    '<div id="'+id+'-sum" style="display:none;margin-top:.85rem">'+sum+'</div></div>';
  }
  return '<div class="hero"><h1>Biology – Full detailed notes</h1><p class="muted">Read full notes · Switch to Quick summary when revising · Based on NCERT Class 11 topics</p></div>'+

  ch('b1','Chapter 1 – The Living World',
  '<p>Biology is the study of living organisms. To study the huge variety of life we need clear definitions and a system of naming and classification.</p>'+
  '<h3>What makes something living?</h3>'+
  '<p>Living organisms show a set of features together: (1) <strong>Growth</strong> – increase in mass and number of cells. (2) <strong>Reproduction</strong> – production of new individuals (sexual or asexual). Some organisms like mules or sterile workers may not reproduce but are still living. (3) <strong>Metabolism</strong> – all chemical reactions in the body (anabolism builds, catabolism breaks down). (4) <strong>Cellular organisation</strong> – cell is the basic unit. (5) <strong>Response to stimuli / consciousness</strong> – ability to sense and react to the environment. (6) <strong>Homeostasis</strong> – keeping internal conditions stable.</p>'+
  '<h3>Biodiversity and need for classification</h3>'+
  '<p>There are millions of known species and many unknown. Classification groups organisms so that we can identify them, study relationships, and communicate using standard names.</p>'+
  '<h3>Taxonomic hierarchy</h3>'+
  '<p>Kingdom → Phylum (animals) or Division (plants) → Class → Order → Family → Genus → Species. Memory: <em>King Philip Came Over For Good Soup</em>. Species is the basic unit – a group of organisms that can interbreed and produce fertile offspring.</p>'+
  '<h3>Binomial nomenclature</h3>'+
  '<p>Given by <strong>Carolus Linnaeus</strong>. Each organism gets a two-part scientific name: <em>Genus species</em>. Rules: Latin or latinised; genus capital, species small; printed in italics (or underlined when handwritten); name of author may be written after species. Example: <em>Homo sapiens</em>, <em>Mangifera indica</em>.</p>'+
  '<h3>Taxonomical aids</h3>'+
  '<p><strong>Herbarium:</strong> storehouse of dried, pressed plant specimens mounted on sheets with labels. Largest in India – Central National Herbarium, Sibpur (Howrah). <strong>Botanical gardens:</strong> living plants for study (e.g. Indian Botanical Garden, Howrah). <strong>Museum:</strong> preserved animals and plants. <strong>Zoological parks:</strong> living wild animals in protected conditions. <strong>Key:</strong> analytical device based on contrasting characters for identification.</p>',
  '<p><strong>Quick:</strong> Living = growth, reproduction, metabolism, cell, response. Hierarchy K-P-C-O-F-G-S. Binomial = Linnaeus. Aids: herbarium, museum, key, garden, zoo.</p>')+

  ch('b2','Chapter 2 – Biological Classification',
  '<p>Early classification was artificial (based on few characters). Aristotle tried habitat. Linnaeus gave two kingdoms – Plantae and Animalia – but this mixed prokaryotes with eukaryotes and fungi with plants.</p>'+
  '<h3>Five kingdom classification (R.H. Whittaker, 1969)</h3>'+
  '<p>Criteria: cell structure (prokaryote/eukaryote), body organisation (unicellular/multicellular), mode of nutrition (auto/hetero), reproduction, phylogenetic relationships.</p>'+
  '<p><strong>Monera:</strong> All prokaryotes – bacteria, cyanobacteria (blue-green algae), Archaebacteria (live in extreme habitats: methanogens, halophiles, thermoacidophiles). No true nucleus; cell wall of peptidoglycan in bacteria.</p>'+
  '<p><strong>Protista:</strong> Unicellular eukaryotes – amoeba, paramecium, euglena, diatoms, dinoflagellates, slime moulds. Some photosynthetic, some heterotrophic.</p>'+
  '<p><strong>Fungi:</strong> Eukaryotic, mostly multicellular (yeast is unicellular). Cell wall of <strong>chitin</strong>. Store food as glycogen. Heterotrophic – saprophytic or parasitic. Examples: Rhizopus (bread mould), mushroom, Penicillium, yeast. Lichens = fungus + algae/cyanobacteria symbiotic association; good pollution indicators.</p>'+
  '<p><strong>Plantae:</strong> Multicellular, eukaryotic, cellulose wall, autotrophic (chlorophyll). Includes algae, bryophytes, pteridophytes, gymnosperms, angiosperms.</p>'+
  '<p><strong>Animalia:</strong> Multicellular, eukaryotic, no cell wall, heterotrophic, usually holozoic.</p>'+
  '<h3>Viruses, viroids, prions</h3>'+
  '<p>Not placed in five kingdoms. <strong>Virus:</strong> nucleoprotein (DNA or RNA + protein coat/capsid); obligate parasite; crystallisable; discovered by Ivanowsky (TMV). <strong>Viroid:</strong> only free RNA, no protein (e.g. potato spindle tuber). <strong>Prion:</strong> infectious protein only (e.g. mad cow disease).</p>',
  '<p><strong>Quick:</strong> Whittaker 1969 – Monera, Protista, Fungi, Plantae, Animalia. Fungi = chitin + glycogen. Virus = nucleoprotein. Viroid = RNA only. Prion = protein only.</p>')+

  ch('b3','Chapter 3 – Plant Kingdom',
  '<p>Plantae includes algae, bryophytes, pteridophytes, gymnosperms and angiosperms. Classification uses thallus organisation, vascular tissue, seeds and flowers.</p>'+
  '<h3>Algae</h3>'+
  '<p>Simple thalloid, mostly aquatic, chlorophyll present. Types: Chlorophyceae (green – Chlamydomonas, Spirogyra), Phaeophyceae (brown – Laminaria, Sargassum; store laminarin), Rhodophyceae (red – Polysiphonia; phycoerythrin). Uses: food, agar, algin, carrageenan, iodine.</p>'+
  '<h3>Bryophytes – amphibians of plant kingdom</h3>'+
  '<p>Live in damp land habitats but need water for fertilisation (motile antherozoids). Plant body thallus-like or leafy; no true roots/stems/leaves; no vascular tissue. Dominant phase is gametophyte. Sporophyte is attached to gametophyte. Examples: Riccia, Marchantia (liverworts), Funaria, Sphagnum (mosses). Sphagnum forms peat.</p>'+
  '<h3>Pteridophytes</h3>'+
  '<p>First terrestrial plants with <strong>xylem and phloem</strong>. Differentiated into root, stem, leaf. Dominant sporophyte. Examples: ferns (Dryopteris, Pteris), Equisetum, Lycopodium. Some are heterosporous (two types of spores) – step toward seed habit.</p>'+
  '<h3>Gymnosperms</h3>'+
  '<p>Naked seeds (not enclosed in fruit). Usually perennial, woody. Examples: Cycas, Pinus, Cedrus. Heterosporous; pollen tube carries male gametes – no external water needed for fertilisation.</p>'+
  '<h3>Angiosperms</h3>'+
  '<p>Seeds inside fruit. Flowers present. Double fertilisation (one fusion → zygote, other → endosperm). Two classes: <strong>Dicotyledons</strong> (two cotyledons, reticulate venation, open vascular bundles) and <strong>Monocotyledons</strong> (one cotyledon, parallel venation, closed bundles).</p>',
  '<p><strong>Quick:</strong> Bryophyte = amphibian. Pteridophyte = first vascular. Gymnosperm = naked seed. Angiosperm = fruit + double fertilisation. Dicots vs monocots.</p>')+

  ch('b4','Morphology of Flowering Plants (high-yield)',
  '<p><strong>Root:</strong> Tap root system (dicot) vs fibrous (monocot). Regions from tip: root cap → meristematic zone → elongation zone → maturation zone (root hairs for absorption). Modifications: storage (carrot), prop roots (banyan), stilt (maize), pneumatophores (mangrove).</p>'+
  '<p><strong>Stem:</strong> Nodes, internodes, buds. Modifications: tuber (potato), rhizome (ginger), corm (colocasia), bulb (onion), tendril (grape), thorn (citrus).</p>'+
  '<p><strong>Leaf:</strong> Leaf base, petiole, lamina. Venation: reticulate (dicot), parallel (monocot). Simple vs compound. Phyllotaxy: alternate, opposite, whorled.</p>'+
  '<p><strong>Flower:</strong> Reproductive structure. Whorls – calyx, corolla, androecium, gynoecium. Actinomorphic (radial) vs zygomorphic (bilateral). Superior vs inferior ovary.</p>'+
  '<h3>Family Solanaceae (potato family) – very important for exams</h3>'+
  '<p>Vegetative: herbs/shrubs, alternate leaves, often hairy. Floral characters: complete, bisexual, actinomorphic; calyx 5 fused, <strong>persistent</strong>; corolla 5 fused; stamens 5, epipetalous; ovary superior, bicarpellary, syncarpous, bilocular with oblique septum; many ovules. Fruit: berry or capsule. Seeds many.</p>'+
  '<p><strong>Floral formula:</strong> ⊕ ⚥ K<sub>(5)</sub> C<sub>(5)</sub> A<sub>5</sub> G<sub>(2)</sub></p>'+
  '<p>Examples: potato (Solanum tuberosum), tomato, brinjal, chilli, petunia, tobacco, ashwagandha.</p>',
  '<p><strong>Quick:</strong> Solanaceae formula ⊕ ⚥ K(5) C(5) A5 G(2). Persistent calyx. Examples potato tomato chilli.</p>')+

  ch('b5','Anatomy of Flowering Plants',
  '<p><strong>Tissues:</strong> Meristematic (dividing) and permanent. Simple permanent: parenchyma, collenchyma, sclerenchyma. Complex: xylem (tracheids, vessels, xylem parenchyma, fibres) and phloem (sieve tubes, companion cells, phloem parenchyma, fibres).</p>'+
  '<p><strong>Dicot root:</strong> Epiblema, cortex, endodermis with <strong>Casparian strips</strong> (suberin), pericycle, stele with xylem in star shape (usually 2–4 arms), phloem in grooves. No pith or small pith.</p>'+
  '<p><strong>Monocot root:</strong> More xylem arms (polyarch), large pith.</p>'+
  '<p><strong>Dicot stem:</strong> Epidermis, hypodermis (collenchyma), cortex, endodermis, pericycle, vascular bundles in a ring, <strong>open</strong> (cambium present) → secondary growth possible. Pith in centre.</p>'+
  '<p><strong>Monocot stem:</strong> Scattered vascular bundles, <strong>closed</strong> (no cambium), sclerenchymatous bundle sheath, no secondary growth.</p>'+
  '<p><strong>Secondary growth:</strong> Vascular cambium forms secondary xylem (wood) inside and secondary phloem outside. Cork cambium (phellogen) forms periderm.</p>',
  '<p><strong>Quick:</strong> Casparian strips in endodermis. Open VB = cambium (dicot stem). Closed = monocot. Secondary growth via cambium.</p>')+

  ch('b6','Photosynthesis in Higher Plants',
  '<p>Photosynthesis is the process by which green plants make organic food from CO₂ and H₂O using light energy trapped by chlorophyll. Overall equation:</p>'+
  '<p style="text-align:center"><strong>6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂</strong> (light, chlorophyll)</p>'+
  '<p>Site: <strong>chloroplast</strong>. Light reaction in <strong>thylakoid membranes</strong>; biosynthetic phase (Calvin cycle) in <strong>stroma</strong>.</p>'+
  '<h3>Light reaction (photochemical phase)</h3>'+
  '<p>Two photosystems: PS II (P680) and PS I (P700). Light hits PS II → electrons excited → passed through electron transport chain → PS I → finally to NADP⁺ forming NADPH. Water is split at PS II (<strong>photolysis</strong>): 2H₂O → 4H⁺ + 4e⁻ + O₂. Oxygen is released. As electrons move, protons are pumped into thylakoid lumen creating a gradient. Protons flow out through <strong>ATP synthase</strong> making ATP (<strong>chemiosmosis</strong>, Peter Mitchell).</p>'+
  '<h3>Calvin cycle (C3 pathway)</h3>'+
  '<p>CO₂ is fixed by enzyme <strong>RuBisCO</strong> on RuBP (5C) → unstable 6C → two molecules of 3-PGA (3C). PGA is reduced to sugar (triose phosphate) using ATP and NADPH. RuBP is regenerated. For one glucose, cycle must run 6 times.</p>'+
  '<h3>C4 pathway (Hatch–Slack)</h3>'+
  '<p>In plants like maize, sugarcane, sorghum. First stable product is a <strong>4-carbon</strong> acid (OAA). Leaf shows <strong>Kranz anatomy</strong> (bundle sheath cells in a wreath). In mesophyll: PEP (3C) + CO₂ → OAA by <strong>PEP carboxylase</strong>. 4C compound goes to bundle sheath → releases CO₂ → Calvin cycle. Advantage: almost no photorespiration; efficient in high light and temperature.</p>'+
  '<h3>Photorespiration</h3>'+
  '<p>When O₂ is high and CO₂ low, RuBisCO binds O₂ instead of CO₂ – wasteful process common in C3 plants on hot bright days. C4 plants avoid it.</p>',
  '<p><strong>Quick:</strong> Light → ATP+NADPH+O₂ in thylakoid. Calvin in stroma. C4 = Kranz + PEP carboxylase. Photorespiration in C3.</p>')+

  ch('b7','Respiration in Plants',
  '<p>Respiration breaks food to release energy as ATP. Can be aerobic (with O₂) or anaerobic (without O₂).</p>'+
  '<h3>Glycolysis (EMP pathway)</h3>'+
  '<p>Occurs in <strong>cytoplasm</strong> of all living cells. Glucose (6C) → 2 pyruvate (3C). Net gain: <strong>2 ATP</strong> + 2 NADH. No oxygen required. Steps include phosphorylation, splitting to PGAL, oxidation to PGA, and pyruvate formation.</p>'+
  '<h3>Aerobic respiration</h3>'+
  '<p>Pyruvate enters mitochondria. Converted to Acetyl CoA (links to Krebs). <strong>Krebs cycle (TCA)</strong> in mitochondrial <strong>matrix</strong>: Acetyl CoA + oxaloacetate → citrate → … regenerates oxaloacetate; releases CO₂; produces NADH, FADH₂, 1 GTP/ATP per turn. <strong>Electron transport system</strong> on inner membrane (cristae): NADH and FADH₂ donate electrons; final acceptor is O₂ → water; ATP made by oxidative phosphorylation. Total yield roughly <strong>36–38 ATP</strong> per glucose (textbook value often 38; actual closer to ~30–32 in eukaryotes).</p>'+
  '<h3>Anaerobic respiration / fermentation</h3>'+
  '<p>In yeast: pyruvate → ethanol + CO₂. In muscles during oxygen lack: pyruvate → lactic acid. Only glycolysis ATP (net 2) is available.</p>'+
  '<h3>Respiratory Quotient (RQ)</h3>'+
  '<p>RQ = CO₂ released / O₂ consumed. Carbohydrates aerobic = <strong>1</strong>. Fats ≈ 0.7. Proteins ≈ 0.9. Anaerobic respiration of carbohydrates = <strong>infinity</strong> (no O₂ used).</p>',
  '<p><strong>Quick:</strong> Glycolysis cytoplasm net 2 ATP. Krebs matrix. ETS cristae. RQ carbs=1; anaerobic=∞.</p>')+

  ch('b8','Plant Growth and Development – Hormones',
  '<p>Growth = irreversible increase in size. Phases: meristematic, elongation, maturation. Development includes growth and differentiation.</p>'+
  '<h3>Plant growth regulators (hormones)</h3>'+
  '<p><strong>Auxin</strong> (IAA): produced in shoot tips. Cell elongation, apical dominance (terminal bud suppresses laterals), root initiation in cuttings, parthenocarpy (seedless fruit). Weedicide 2,4-D is synthetic auxin.</p>'+
  '<p><strong>Gibberellin (GA):</strong> stem elongation, bolting in rosette plants, seed germination (mobilises food), fruit growth.</p>'+
  '<p><strong>Cytokinin:</strong> cell division (cytokinesis), delays senescence (keeps leaves green), with auxin decides root vs shoot in tissue culture, breaks apical dominance.</p>'+
  '<p><strong>Ethylene:</strong> only <strong>gaseous</strong> hormone. Fruit ripening, senescence, abscission (leaf/fruit fall), horizontal growth of seedlings. Ethephon used commercially for ripening.</p>'+
  '<p><strong>Abscisic acid (ABA):</strong> stress hormone. Closes stomata under water stress, promotes dormancy of seeds and buds, antagonist to GA. Helps plant survive drought.</p>',
  '<p><strong>Quick:</strong> Auxin=elongation/apical dominance. GA=elongation/germination. CK=division. Ethylene=ripening (gas). ABA=stress/dormancy.</p>')+

  ch('b9','Animal Kingdom – main points',
  '<p>Classification based on: level of organisation (cellular/tissue/organ), symmetry (radial/bilateral), germ layers (diplo/triplo), coelom (acoelomate/pseudocoelomate/coelomate), segmentation, notochord.</p>'+
  '<p><strong>Porifera:</strong> cellular level, pores, canal system, spicules, e.g. Sycon, Spongilla.</p>'+
  '<p><strong>Cnidaria (Coelenterata):</strong> tissue level, radial symmetry, cnidoblasts (stinging cells), polyp and medusa forms, e.g. Hydra, jellyfish, coral.</p>'+
  '<p><strong>Platyhelminthes:</strong> flatworms, bilateral, acoelomate, many parasites (Taenia, Fasciola), flame cells for excretion.</p>'+
  '<p><strong>Nematoda:</strong> roundworms, pseudocoelomate, e.g. Ascaris, Wuchereria.</p>'+
  '<p><strong>Annelida:</strong> metameric segmentation, true coelom, nephridia for excretion, e.g. earthworm, leech, Nereis.</p>'+
  '<p><strong>Arthropoda:</strong> largest phylum, jointed legs, chitinous exoskeleton, open circulation, e.g. insects, prawn, spider, centipede.</p>'+
  '<p><strong>Mollusca:</strong> soft body, shell often present, muscular foot, e.g. Pila, octopus, mussel.</p>'+
  '<p><strong>Echinodermata:</strong> spiny skin, radial as adult, water vascular system, e.g. starfish, sea urchin.</p>'+
  '<p><strong>Chordata:</strong> notochord, dorsal hollow nerve cord, pharyngeal slits. Vertebrates have vertebral column. Protochordates (Amphioxus, Balanoglossus) are chordates but not vertebrates.</p>'+
  '<p><strong>J&amp;K protected areas (exam favourite):</strong> Dachigam National Park, Kishtwar National Park, City Forest (Mahamaya) National Park, Kazinag, Hemis (Ladakh).</p>',
  '<p><strong>Quick:</strong> Annelida=nephridia+segments. Arthropoda=largest. Chordate=notochord. Parks: Dachigam, Kishtwar, Hemis.</p>')+

  ch('b10','Human Physiology – Breathing, Circulation, Excretion',
  '<p><strong>Breathing:</strong> Inspiration – diaphragm contracts (becomes flat), external intercostal muscles contract → ribs move up and out → thoracic volume increases → pressure falls → air enters lungs. Expiration is largely passive at rest.</p>'+
  '<p>Exchange of gases at alveoli by diffusion. Oxygen transport: mostly as oxyhaemoglobin in RBCs. CO₂ transport: mostly as bicarbonate ions in plasma; some as carbamino haemoglobin; little dissolved.</p>'+
  '<p><strong>Circulation:</strong> Human heart is four-chambered. Double circulation – pulmonary circuit (heart–lungs–heart) and systemic circuit (heart–body–heart). SA node in right atrium is the <strong>pacemaker</strong>. Blood pressure: normal about 120/80 mm Hg.</p>'+
  '<p><strong>Excretion:</strong> Functional unit of kidney is <strong>nephron</strong>. Steps: glomerular filtration, tubular reabsorption, tubular secretion. Concentrated urine is formed with help of <strong>counter-current mechanism</strong> in loop of Henle and vasa recta. ADH (vasopressin) increases water reabsorption from collecting duct when body needs water.</p>',
  '<p><strong>Quick:</strong> Inspiration=diaphragm down. Double circulation. SA node=pacemaker. Nephron; counter-current; ADH.</p>')+

  ch('b11','Locomotion and Movement – Muscle contraction',
  '<p>Skeletal muscles are striated and voluntary. Each muscle fibre has myofibrils made of actin (thin) and myosin (thick) filaments arranged in <strong>sarcomeres</strong> (Z-line to Z-line).</p>'+
  '<h3>Sliding filament theory (detailed – for 5 marks)</h3>'+
  '<p>1. Motor nerve impulse reaches neuromuscular junction and releases acetylcholine.</p>'+
  '<p>2. Action potential spreads on muscle membrane and into T-tubules.</p>'+
  '<p>3. Sarcoplasmic reticulum releases <strong>Ca²⁺ ions</strong> into sarcoplasm.</p>'+
  '<p>4. Ca²⁺ binds troponin → tropomyosin moves → active sites on actin are exposed.</p>'+
  '<p>5. Myosin heads (already energised by ATP hydrolysis) bind actin forming <strong>cross-bridges</strong>.</p>'+
  '<p>6. Power stroke – myosin head pulls actin filament toward centre of sarcomere. Sarcomere shortens; muscle contracts.</p>'+
  '<p>7. New ATP binds myosin → head detaches. Cycle repeats if Ca²⁺ and ATP present.</p>'+
  '<p>8. When impulse stops, Ca²⁺ is pumped back into SR. Sites on actin are covered → relaxation.</p>'+
  '<p>Diagram must show: sarcomere, Z-lines, A-band, I-band, actin, myosin.</p>',
  '<p><strong>Quick:</strong> Ca²⁺ → cross-bridge → power stroke → ATP for detach. Sarcomere shortens.</p>')+

  ch('b12','Neural Control and Coordination',
  '<p>Neuron structure: dendrites (receive), cell body, axon (carry away). Myelin sheath (from Schwann cells) insulates; gaps are nodes of Ranvier.</p>'+
  '<h3>Nerve impulse (detailed – for 5 marks)</h3>'+
  '<p><strong>Resting potential:</strong> Inside of axon is negative about <strong>−70 mV</strong> relative to outside. Maintained by Na⁺/K⁺ pump (3 Na⁺ out, 2 K⁺ in) and membrane permeability.</p>'+
  '<p><strong>Depolarisation:</strong> Stimulus opens Na⁺ channels → Na⁺ rushes in → inside becomes positive (about +30 mV).</p>'+
  '<p><strong>Repolarisation:</strong> Na⁺ channels close, K⁺ channels open → K⁺ exits → inside becomes negative again. Brief hyperpolarisation may occur, then pump restores resting state.</p>'+
  '<p>This local change triggers the next region – impulse travels as a wave. In myelinated fibres impulse jumps from node to node (<strong>saltatory conduction</strong>) – much faster and saves energy.</p>'+
  '<p><strong>Synapse:</strong> Junction between two neurons. Chemical synapse: impulse causes release of neurotransmitter (e.g. acetylcholine) into synaptic cleft; it binds receptors on next neuron and starts new impulse. Then transmitter is broken down (e.g. by acetylcholinesterase).</p>'+
  '<p>Human brain: forebrain (cerebrum, thalamus, hypothalamus), midbrain, hindbrain (pons, cerebellum, medulla). Spinal cord relays and controls reflexes.</p>',
  '<p><strong>Quick:</strong> Rest −70 mV. Na⁺ in = depolarisation. K⁺ out = repolarisation. Saltatory in myelin. Chemical synapse.</p>');
};

  qa('5 marks','Mechanism of muscle contraction (sliding filament).','Impulse → ACh → Ca²⁺ from SR → troponin-tropomyosin shift → cross-bridges → power stroke → ATP detachment → relaxation when Ca²⁺ pumped back. Draw sarcomere.')+

function evalMcq(){
  var box = document.getElementById('mcqBox');
  if(!box){ return; }
  var c=0, t=0;
  box.querySelectorAll('.q-box').forEach(function(qbox){
    t++;
    var ans = parseInt(qbox.getAttribute('data-a'), 10);
    var reason = qbox.getAttribute('data-r') || '';
    var sel = qbox.querySelector('input[type=radio]:checked');
    qbox.classList.remove('ok','bad');
    var old = qbox.querySelector('.explain');
    if(old) old.remove();
    var labels = qbox.querySelectorAll('label');
    var correctText = '';
    labels.forEach(function(lab, idx){
      lab.style.border = '1px solid transparent';
      lab.style.background = '';
      if(idx === ans){
        correctText = lab.textContent.trim();
        lab.style.border = '1px solid #34d399';
        lab.style.background = 'rgba(52,211,153,.12)';
      }
    });
    var exp = document.createElement('div');
    exp.className = 'explain';
    if(sel && parseInt(sel.value,10) === ans){
      c++;
      qbox.classList.add('ok');
      exp.className += ' ok';
      exp.innerHTML = '✓ Correct. ' + reason;
    } else {
      qbox.classList.add('bad');
      exp.className += ' bad';
      var your = sel ? sel.parentElement.textContent.trim() : 'No option selected';
      exp.innerHTML = '✗ Your answer: ' + your + '<br>✓ Correct: <strong>' + correctText + '</strong><br>' + reason;
      if(sel && sel.parentElement){
        sel.parentElement.style.border = '1px solid #ff5c7a';
        sel.parentElement.style.background = 'rgba(255,92,122,.12)';
      }
    }
    qbox.appendChild(exp);
  });
  var sc = document.getElementById('mcqScore');
  if(sc){
    sc.classList.remove('hidden');
    sc.textContent = 'Score: ' + c + '/' + t + ' (' + (t?Math.round(c/t*100):0) + '%)';
  }
}

function shuffle(a){
  var arr=a.slice();
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=arr[i];arr[i]=arr[j];arr[j]=t;
  }
  return arr;
}
function renderBank(subj, title, n){
  n = n || 50;
  var bank = (typeof QBANKS !== 'undefined' && QBANKS[subj]) ? QBANKS[subj] : [];
  if(!bank.length){
    return '<div class="card"><h2>'+title+'</h2><p>Question bank loading… Refresh the page.</p></div>';
  }
  var qs = shuffle(bank).slice(0, Math.min(n, bank.length));
  var h = '<div class="card"><h2>'+title+'</h2><p class="muted">'+qs.length+' questions · Select an option · Then Evaluate</p>';
  h += '<button type="button" class="btn btn-ghost btn-sm" id="shuffleBtn">🔀 Shuffle again</button><div id="mcqBox" style="margin-top:.75rem">';
  qs.forEach(function(q,i){
    var reason = String(q[6]||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
    var question = String(q[0]||'');
    h += '<div class="q-box" data-a="'+q[5]+'" data-r="'+reason+'"><strong>Q'+(i+1)+'.</strong> '+question+'<div class="options">';
    for(var j=1;j<=4;j++){
      h += '<label><input type="radio" name="mq'+i+'" value="'+(j-1)+'"> '+String.fromCharCode(64+j)+'. '+q[j]+'</label>';
    }
    h += '</div></div>';
  });
  h += '</div><button type="button" class="btn btn-primary" style="margin-top:1rem" id="evalBtn">Evaluate</button><div id="mcqScore" class="score hidden"></div></div>';
  // attach after inject
  setTimeout(function(){
    var eb = document.getElementById('evalBtn');
    if(eb) eb.onclick = evalMcq;
    var sb = document.getElementById('shuffleBtn');
    if(sb) sb.onclick = function(){ document.getElementById('main').innerHTML = renderBank(subj, title, n); };
  }, 30);
  return h;
}

function normalize(s){
  return (s||'').toLowerCase()
    .replace(/portrit|potrait|potriat/g,'portrait')
    .replace(/summ[ae]ry/g,'summary')
    .replace(/grammer/g,'grammar')
    .replace(/defin[e]?/g,'define')
    .replace(/expla+in/g,'explain')
    .replace(/[^a-z0-9\\s]/g,' ')
    .replace(/\\s+/g,' ')
    .trim();
}

function aiReply(q){
  var raw = (q||'').trim();
  var t = normalize(raw);
  if(!t) return 'Type a question, e.g. "explain waves" or "summary of portrait of a lady".';

  // passive transform
  var pm = raw.match(/passive[:\\s]+(.+)/i) || raw.match(/change to passive[:\\s]*(.+)/i);
  if(pm){
    return 'Passive pattern: object + be + past participle (V3).\\nExamples:\\n• She writes a letter → A letter is written by her.\\n• They are watching a film → A film is being watched by them.\\nYour sentence: "'+pm[1].trim()+'" – apply the same pattern.';
  }

  // score all KB entries by keyword hits
  var best=null, bestScore=0;
  for(var i=0;i<AI_KB.length;i++){
    var score=0;
    var keys=AI_KB[i].k;
    for(var j=0;j<keys.length;j++){
      if(t.indexOf(keys[j])>=0) score += keys[j].length + 2;
    }
    // also check individual words
    var words=t.split(' ');
    for(var w=0;w<words.length;w++){
      if(words[w].length<3) continue;
      for(var j=0;j<keys.length;j++){
        if(keys[j].indexOf(words[w])>=0 || words[w].indexOf(keys[j])>=0) score += 2;
      }
    }
    if(score>bestScore){ bestScore=score; best=AI_KB[i].a; }
  }
  if(best && bestScore>=3) return best;

  // topic-ish fallbacks
  if(/friction/.test(t)) return AI_KB.find(function(x){return x.k[0]==='friction';}).a;
  if(/wave/.test(t)) return AI_KB.find(function(x){return x.k[0]==='wave';}).a;
  if(/portrait|grandmother|lady/.test(t)) return AI_KB.find(function(x){return x.k.indexOf('portrait')>=0;}).a;
  if(/photo|calvin|c4|chlorophyll/.test(t)) return AI_KB[0].a;
  if(/respir|glycol|krebs|rq/.test(t)) return AI_KB[2].a;

  if(/how to study|full marks|exam tip/.test(t))
    return '1) Read detailed notes until clear.\\n2) Do 20 MCQs daily with Evaluate.\\n3) Write one 5-mark answer from memory.\\n4) Attempt Full Board Papers under time.\\n5) Revise formulas and diagrams.';

  return 'I did not find an exact match, but try asking more clearly, for example:\\n• "explain waves"\\n• "summary of portrait of a lady"\\n• "what is glycolysis"\\n• "escape velocity formula"\\n\\nOr open Notes / Practice / Papers (20 papers per subject) for full content.';
}
